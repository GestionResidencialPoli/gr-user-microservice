name: CI

on:
  push:
    branches: [main, qa, develop]
  pull_request:
    branches: [main, qa, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compilar y correr pruebas (unitarias + integracion)
        run: ./mvnw --batch-mode verify

  docker-smoke-test:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: gr-user-microservice:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Levantar Postgres para la prueba de arranque
        run: |
          docker run -d --name postgres-smoke \
            -e POSTGRES_DB=gr_user_db -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec postgres-smoke pg_isready -U postgres -d gr_user_db && break
            sleep 1
          done

      - name: Arrancar el contenedor y validar /actuator/health
        run: |
          docker run -d --name app-smoke \
            --network host \
            -e DB_URL=jdbc:postgresql://localhost:5432/gr_user_db \
            -e DB_USERNAME=postgres -e DB_PASSWORD=postgres \
            -e JWT_SECRET=ci-secreto-de-al-menos-32-caracteres-para-pruebas \
            -e INTERNAL_SERVICE_TOKEN=ci-secreto-de-al-menos-32-caracteres-para-pruebas \
            gr-user-microservice:ci

          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/actuator/health || true)
            if [ "$status" = "200" ]; then
              echo "Servicio saludable"
              exit 0
            fi
            sleep 2
          done

          echo "El servicio no llego a estar saludable a tiempo"
          docker logs app-smoke
          exit 1

      - name: Logs (si algo fallo)
        if: failure()
        run: docker logs app-smoke || true
