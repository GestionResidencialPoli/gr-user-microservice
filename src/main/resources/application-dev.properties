# Perfil de desarrollo local (GR-50).
# Se activa por defecto al correr "./mvnw spring-boot:run" (ver spring-boot-maven-plugin
# en pom.xml). El jar empaquetado NUNCA activa este perfil por su cuenta, por lo que
# ningun otro entorno (incluida produccion) carga estos datos a menos que alguien
# active el perfil "dev" explicitamente ahi, algo que no deberia hacerse nunca.

# Agrega la migracion de datos semilla (db/seed/V900__...) a las migraciones reales
# de esquema (db/migration). Los numeros de version en db/seed empiezan en 900
# precisamente para no chocar con los de db/migration.
spring.flyway.locations=classpath:db/migration,classpath:db/seed
