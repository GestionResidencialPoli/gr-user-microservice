spring.application.name=UserMicroservice

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gr_user_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.flyway.enabled=true
spring.sql.init.mode=never

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-minutes=${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:15}
jwt.refresh-token-expiration-days=${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:7}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

app.security.cookie.secure=${COOKIE_SECURE:true}
app.security.cookie.same-site=Strict
app.security.cookie.access-token-name=access_token
app.security.cookie.refresh-token-name=refresh_token
app.security.cookie.refresh-token-path=/api/v1/auth
